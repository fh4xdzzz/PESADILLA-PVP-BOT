name: Dashboard checks
on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-checks.yml'
  push:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-checks.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dashboard syntax
        run: |
          node --check dashboard/lucide-icons.js
          node --check dashboard/pro-ui.js
          node --check dashboard/worker.js
          node --check dashboard/replay-api.js
          node --check dashboard/replay-client.js
          node --check dashboard/replay-view.js
          node --check dashboard/replay-theater.js
          node --check dashboard/reports.js
      - name: Report system tests
        run: node --test dashboard/tests/*.test.js
      - name: Check D1 configuration
        run: node -e "const fs=require('fs'); const json=JSON.parse(fs.readFileSync('dashboard/wrangler.jsonc','utf8')); if (!json.d1_databases?.some(x=>x.binding==='DB')) process.exit(1)"
